<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Page</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #e9ecef;
            --card-background: #ffffff;
            --text-color: #343a40;
            --heading-color: #0056b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-background);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 700px;
            width: 90%;
            margin: 20px;
        }
        h1 {
            color: var(--heading-color);
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 600;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 30px;
            color: var(--secondary-color);
        }
        a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #003d80;
            text-decoration: underline;
        }
        .cta-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }
        .cta-button:hover {
            background-color: #0056b3;
            text-decoration: none;
            transform: translateY(-2px);
        }
    </style>
</head>

    <div class="container">
        <h1>Welcome to Your Enhanced Page</h1>
        <p>This page has been updated with a more modern and user-friendly interface, designed for better readability and visual appeal.</p>

        <a href="#" class="cta-button">Learn More</a>
    </div>
</body>
</html>
